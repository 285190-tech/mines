<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gem Rush · Play-Money Mines</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#1a0b3b; --bg2:#2b0f54; --ink:#fff6e8; --dim:#b9a6e0;
  --gold:#ffc93c; --rose:#ff4d8d; --teal:#2de2c8; --rock:#3a2470;
  --heat:0; --glow:hsl(calc(280 - 235*var(--heat)),95%,62%);
  font-family:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:var(--ink);overscroll-behavior:none}
body{
  background:
    radial-gradient(900px 600px at 50% -10%,#6a2bd1 0%,transparent 60%),
    radial-gradient(600px 500px at 90% 110%,#c0287a55 0%,transparent 60%),
    linear-gradient(180deg,var(--bg2),var(--bg1));
  background-attachment:fixed;
  padding:env(safe-area-inset-top,0) 14px env(safe-area-inset-bottom,0);
  overflow-x:hidden;
}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
h1,.big,button,.tag{font-family:'Lilita One',sans-serif;font-weight:400}
header{max-width:980px;margin:0 auto;padding:16px 0 6px;display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{margin:0;font-size:clamp(26px,5vw,38px);letter-spacing:.5px;background:linear-gradient(90deg,var(--gold),var(--rose),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 12px #ff4d8d66)}
.wallet{background:#00000040;border:2px solid #ffffff22;border-radius:999px;padding:8px 18px;font-size:22px;color:var(--gold);box-shadow:inset 0 0 18px #ffc93c22;transition:transform .2s}
.wallet.pop{animation:pop .5s}
.wallet small{font-family:'Nunito';font-size:12px;color:var(--dim);margin-right:8px;font-weight:800}
main{max-width:980px;margin:8px auto 40px;display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
@media(max-width:760px){main{grid-template-columns:1fr}.board-wrap{order:-1}}
.panel{background:linear-gradient(180deg,#ffffff14,#ffffff08);border:2px solid #ffffff1f;border-radius:26px;padding:18px;backdrop-filter:blur(8px)}
label{display:block;font-weight:800;font-size:14px;color:var(--dim);margin:14px 0 6px}
.row{display:flex;gap:8px}
input[type=number]{width:100%;background:#0000004d;border:2px solid #ffffff22;border-radius:14px;color:var(--ink);font:800 20px 'Nunito';padding:10px 12px;outline:none}
input[type=number]:focus-visible,button:focus-visible,.tile:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.mini{background:#ffffff1c;border:0;border-radius:12px;color:var(--ink);padding:0 14px;font-size:18px;cursor:pointer;transition:.15s}
.mini:hover{background:#ffffff35;transform:translateY(-2px)}
input[type=range]{width:100%;accent-color:var(--rose);height:28px}
.mineinfo{display:flex;justify-content:space-between;font-weight:800}
.go{width:100%;margin-top:18px;border:0;border-radius:20px;padding:16px;font-size:26px;color:#3a1200;cursor:pointer;
  background:linear-gradient(180deg,#ffe27a,var(--gold) 55%,#ff9d2e);box-shadow:0 6px 0 #b8610f,0 12px 28px #ffb02e66;transition:transform .1s,box-shadow .1s;position:relative;overflow:hidden}
.go:hover{transform:translateY(-2px)}
.go:active{transform:translateY(5px);box-shadow:0 1px 0 #b8610f,0 4px 12px #ffb02e66}
.go.cash{background:linear-gradient(180deg,#8bffea,var(--teal) 55%,#12a98f);color:#04332c;box-shadow:0 6px 0 #0b7a68,0 12px 30px #2de2c877;animation:throb .9s infinite}
.go:disabled{filter:grayscale(.8) brightness(.7);cursor:not-allowed;animation:none}
.go::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#fff9,transparent);transform:skewX(-20deg);animation:sheen 2.6s infinite}
.refill{display:none;width:100%;margin-top:10px;background:var(--rose);color:#fff;border:0;border-radius:16px;padding:12px;font-size:20px;cursor:pointer}
.refill.show{display:block;animation:pop .5s}
.board-wrap{text-align:center}
.mult{margin-bottom:12px;min-height:118px}
.big{font-size:clamp(54px,12vw,92px);line-height:1;color:var(--glow);text-shadow:0 0 calc(10px + 40px*var(--heat)) var(--glow),0 4px 0 #0006;transition:color .3s}
.big.bump{animation:bump .35s}
.sub{font-weight:800;color:var(--dim);margin-top:4px;min-height:24px}
.sub b{color:var(--gold)}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(6px,1.6vw,12px);padding:clamp(10px,2vw,18px);border-radius:30px;background:#0000003d;
  border:3px solid var(--glow);box-shadow:0 0 calc(18px + 60px*var(--heat)) var(--glow),inset 0 0 40px #00000080;transition:box-shadow .4s,border-color .4s;max-width:560px;margin:0 auto}
.board.shake{animation:shake .5s}
.tile{aspect-ratio:1;border:0;border-radius:20%;position:relative;cursor:pointer;padding:0;
  background:radial-gradient(circle at 30% 25%,#7a52c9,var(--rock) 70%);box-shadow:0 5px 0 #1d0f40,inset 0 2px 0 #ffffff33;transition:transform .12s,filter .2s;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#ffffff40 50%,transparent 65%);transform:translateX(-120%);transition:transform .5s}
.board.live .tile:not(.open):hover{transform:translateY(-4px) scale(1.04);filter:brightness(1.25)}
.board.live .tile:not(.open):hover::before{transform:translateX(120%)}
.tile:not(.open):active{transform:translateY(3px) scale(.96)}
.tile.open{cursor:default;box-shadow:inset 0 0 0 2px #ffffff22;background:radial-gradient(circle,#0000005a,#00000099)}
.tile.dim{opacity:.45;transform:scale(.9)}
.gem,.bomb{position:absolute;inset:14%;display:grid;place-items:center;animation:reveal .55s cubic-bezier(.2,1.6,.4,1) both}
.gem{clip-path:polygon(50% 0,92% 30%,78% 100%,22% 100%,8% 30%);background:linear-gradient(135deg,hsl(var(--h),100%,85%),hsl(var(--h),90%,55%) 50%,hsl(var(--h),90%,35%));filter:drop-shadow(0 0 10px hsl(var(--h),100%,60%))}
.gem::after{content:"";position:absolute;inset:0;background:linear-gradient(60deg,transparent 40%,#fff9 50%,transparent 60%);animation:glint 1.6s infinite}
.tile.open .gem-wrap{position:absolute;inset:0;animation:glow 1.8s infinite alternate;border-radius:20%}
.bomb{font-size:clamp(26px,6vw,46px);animation:boom .6s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(0 0 14px #ff2a2a)}
.tile.hit{background:radial-gradient(circle,#ff5a3c,#7a0b0b)}
.hint{margin-top:14px;color:var(--dim);font-weight:700;font-size:14px}
.float{position:fixed;z-index:60;font-family:'Lilita One';pointer-events:none;color:var(--gold);text-shadow:0 3px 0 #0007,0 0 18px #ffc93c;animation:rise 1.4s ease-out forwards;white-space:nowrap}
.banner{position:fixed;left:50%;top:38%;z-index:70;transform:translate(-50%,-50%);font-family:'Lilita One';font-size:clamp(44px,12vw,110px);pointer-events:none;text-align:center;
  background:linear-gradient(180deg,#fff,var(--gold) 50%,var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 #0008) drop-shadow(0 0 30px #ffc93c);animation:banner 1.8s cubic-bezier(.2,1.4,.4,1) forwards}
.flash{position:fixed;inset:0;z-index:40;pointer-events:none;animation:flash .5s forwards}
@keyframes pop{50%{transform:scale(1.18)}}
@keyframes bump{40%{transform:scale(1.22) rotate(-2deg)}}
@keyframes throb{50%{transform:scale(1.03)}}
@keyframes sheen{to{left:140%}}
@keyframes shake{20%{transform:translate(-10px,4px) rotate(-1deg)}40%{transform:translate(9px,-6px) rotate(1deg)}60%{transform:translate(-7px,5px)}80%{transform:translate(5px,-3px)}}
@keyframes reveal{from{transform:scale(0) rotate(-120deg)}to{transform:scale(1) rotate(0)}}
@keyframes boom{from{transform:scale(0)}60%{transform:scale(1.5)}to{transform:scale(1)}}
@keyframes glint{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes glow{to{box-shadow:inset 0 0 22px hsl(var(--h),100%,60%)}}
@keyframes rise{from{opacity:1;transform:translate(-50%,0) scale(.6)}20%{transform:translate(-50%,-20px) scale(1.2)}to{opacity:0;transform:translate(-50%,-110px) scale(1)}}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-8deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(2deg)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(1.1)}}
@keyframes flash{from{background:var(--fc,#fff8)}to{background:transparent}}
@media(prefers-reduced-motion:reduce){.board.shake,.go.cash,.go::after,.gem::after{animation:none}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<header>
  <h1>💎 Gem Rush</h1>
  <div class="wallet" id="wallet"><small>PLAY MONEY</small>$<span id="bal">1000</span></div>
</header>

<main>
  <section class="panel">
    <label for="bet">Bet</label>
    <div class="row">
      <input id="bet" type="number" min="1" step="1" value="10" inputmode="numeric">
      <button class="mini" id="half" aria-label="Halve bet">½</button>
      <button class="mini" id="dbl" aria-label="Double bet">2×</button>
    </div>
    <label for="mines" class="mineinfo"><span>Mines</span><span id="minesLabel">3</span></label>
    <input id="mines" type="range" min="1" max="24" value="3">
    <button class="go" id="go">Start</button>
    <button class="refill" id="refill">Out of cash? Grab $1000 more</button>
    <p class="hint">Pick gems. Every gem multiplies your bet. Cash out before you hit a mine.</p>
  </section>

  <section class="board-wrap">
    <div class="mult">
      <div class="big" id="mult">1.00×</div>
      <div class="sub" id="sub">Place a bet and start digging</div>
    </div>
    <div class="board" id="board" role="grid" aria-label="Mine field"></div>
  </section>
</main>

<script>
(()=>{
const N=25, $=id=>document.getElementById(id);
const boardEl=$('board'), balEl=$('bal'), multEl=$('mult'), subEl=$('sub'), goBtn=$('go'), betEl=$('bet'), minesEl=$('mines');
let store=0; try{store=parseFloat(localStorage.getItem('gemrush_bal'))}catch(e){}
let bal=isFinite(store)&&store>0?store:1000, active=false, mines=new Set(), found=0, bet=0, mult=1, shown=bal;
const tiles=[];

/* ---------- audio ---------- */
let ac=null;
function tone(f,t=.15,type='triangle',vol=.15,slide=0,delay=0){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+delay;
    o.type=type;o.frequency.setValueAtTime(f,s);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),s+t);
    g.gain.setValueAtTime(vol,s);g.gain.exponentialRampToValueAtTime(.001,s+t);
    o.connect(g).connect(ac.destination);o.start(s);o.stop(s+t);
  }catch(e){}
}
const scale=[0,2,4,7,9,12,14,16,19,21,24,26,28,31];
const note=k=>523.25*Math.pow(2,scale[Math.min(k,scale.length-1)]/12);
const sfx={
  gem(k){tone(note(k),.25,'triangle',.18);tone(note(k)*2,.3,'sine',.07,0,.03);tone(note(k)*3,.2,'sine',.04,0,.06)},
  bomb(){tone(160,.6,'sawtooth',.28,.2);tone(60,.8,'square',.2,.3);tone(900,.3,'sawtooth',.1,.1)},
  start(){tone(330,.1,'square',.07);tone(440,.12,'square',.07,0,.07)},
  win(m){[0,4,7,12,16,19].forEach((s,i)=>tone(523.25*Math.pow(2,s/12),.35,'triangle',.16,0,i*.07))}
};

/* ---------- particles ---------- */
const cv=$('fx'),cx=cv.getContext('2d');let W,H,P=[];
function size(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',size);size();
function burst(x,y,n,hue,power=1,gold=false){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283,v=(2+Math.random()*7)*power;
    P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2*power,l:1,d:.012+Math.random()*.018,s:3+Math.random()*7,
      c:gold?`hsl(${35+Math.random()*30},100%,${60+Math.random()*25}%)`:`hsl(${hue+Math.random()*40-20},100%,${60+Math.random()*25}%)`,r:Math.random()*6,vr:(Math.random()-.5)*.4,sq:Math.random()<.5});
  }
}
function confettiRain(n){for(let i=0;i<n;i++)P.push({x:Math.random()*W,y:-20-Math.random()*H*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,l:1.6,d:.008,s:6+Math.random()*7,
  c:`hsl(${Math.random()*360},100%,65%)`,r:0,vr:(Math.random()-.5)*.4,sq:true,g:.05})}
const dust=Array.from({length:40},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*2+.5,v:Math.random()*.3+.1,p:Math.random()*6}));
(function loop(t){
  cx.clearRect(0,0,W,H);
  cx.fillStyle='#ffffff';
  for(const d of dust){d.y-=d.v;if(d.y<-5){d.y=H+5;d.x=Math.random()*W}cx.globalAlpha=.15+.15*Math.sin(t/700+d.p);cx.beginPath();cx.arc(d.x+Math.sin(t/2000+d.p)*12,d.y,d.r,0,6.283);cx.fill()}
  cx.globalAlpha=1;
  for(let i=P.length-1;i>=0;i--){
    const p=P[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g??.28;p.vx*=.99;p.l-=p.d;p.r+=p.vr;
    if(p.l<=0||p.y>H+30){P.splice(i,1);continue}
    cx.globalAlpha=Math.min(1,p.l);cx.fillStyle=p.c;cx.shadowColor=p.c;cx.shadowBlur=10;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);
    if(p.sq)cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);else{cx.beginPath();cx.arc(0,0,p.s/2,0,6.283);cx.fill()}
    cx.restore();
  }
  cx.globalAlpha=1;cx.shadowBlur=0;requestAnimationFrame(loop);
})(0);

/* ---------- helpers ---------- */
const fmt=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):(Math.round(v*100)/100).toString();
function calc(k,m){let r=.99;for(let i=0;i<k;i++)r*=(N-i)/(N-m-i);return r}
function setBal(v){bal=Math.max(0,Math.round(v*100)/100);try{localStorage.setItem('gemrush_bal',bal)}catch(e){}
  const from=shown,to=bal,t0=performance.now();
  (function tick(t){const k=Math.min(1,(t-t0)/600);shown=from+(to-from)*(1-Math.pow(1-k,3));balEl.textContent=fmt(shown);if(k<1)requestAnimationFrame(tick)})(t0);
  const w=$('wallet');w.classList.remove('pop');void w.offsetWidth;w.classList.add('pop');
  $('refill').classList.toggle('show',bal<1&&!active)}
function floatText(txt,x,y,size=34,color){const e=document.createElement('div');e.className='float';e.textContent=txt;e.style.cssText=`left:${x}px;top:${y}px;font-size:${size}px;${color?'color:'+color:''}`;document.body.appendChild(e);setTimeout(()=>e.remove(),1400)}
function banner(t){const e=document.createElement('div');e.className='banner';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
function flash(c){const e=document.createElement('div');e.className='flash';e.style.setProperty('--fc',c);document.body.appendChild(e);setTimeout(()=>e.remove(),500)}
function center(el){const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]}
function setHeat(m){document.documentElement.style.setProperty('--heat',Math.min(1,(m-1)/15))}
function showMult(){multEl.textContent=mult.toFixed(2)+'×';multEl.classList.remove('bump');void multEl.offsetWidth;multEl.classList.add('bump');setHeat(mult)}

/* ---------- board ---------- */
for(let i=0;i<N;i++){
  const b=document.createElement('button');b.className='tile';b.setAttribute('role','gridcell');b.setAttribute('aria-label','Tile '+(i+1));
  b.onclick=()=>pick(i);tiles.push(b);boardEl.appendChild(b);
}
const gemHue=i=>[320,48,175,265,18,200][i%6];
function drawGem(i,dim){
  const t=tiles[i];t.classList.add('open');
  t.innerHTML=`<div class="gem-wrap" style="--h:${gemHue(i)}"><div class="gem" style="--h:${gemHue(i)}"></div></div>`;
  if(dim)t.classList.add('dim');
}
function drawBomb(i,dim,hit){const t=tiles[i];t.classList.add('open');if(hit)t.classList.add('hit');t.innerHTML='<div class="bomb">💣</div>';if(dim)t.classList.add('dim')}
function resetBoard(){tiles.forEach(t=>{t.className='tile';t.innerHTML=''})}

function updateUI(){
  minesEl.disabled=betEl.disabled=$('half').disabled=$('dbl').disabled=active;
  boardEl.classList.toggle('live',active);
  if(active){
    goBtn.className='go cash';goBtn.disabled=found===0;
    goBtn.textContent=found?`Cash out $${fmt(bet*mult)}`:'Pick a tile';
    const next=calc(found+1,mines.size);
    subEl.innerHTML=`Next gem: <b>${next.toFixed(2)}×</b> · ${N-mines.size-found} gems left`;
  }else{goBtn.className='go';goBtn.disabled=false;goBtn.textContent='Start'}
}

function start(){
  bet=Math.floor(parseFloat(betEl.value));
  if(!(bet>=1)){betEl.value=1;bet=1}
  if(bet>bal){bet=Math.floor(bal);betEl.value=bet}
  if(bet<1){$('refill').classList.add('show');return}
  setBal(bal-bet);resetBoard();
  const m=+minesEl.value;mines=new Set();while(mines.size<m)mines.add(Math.floor(Math.random()*N));
  found=0;mult=1;active=true;multEl.textContent='1.00×';setHeat(1);sfx.start();updateUI();
}

function pick(i){
  if(!active){if(!tiles[i].classList.contains('open')){goBtn.animate([{transform:'scale(1)'},{transform:'scale(1.08)'},{transform:'scale(1)'}],300)}return}
  if(tiles[i].classList.contains('open'))return;
  const [x,y]=center(tiles[i]);
  if(mines.has(i)){
    active=false;drawBomb(i,false,true);
    sfx.bomb();burst(x,y,70,15,1.4);burst(x,y,30,40,1);flash('#ff2a2a88');
    boardEl.classList.remove('shake');void boardEl.offsetWidth;boardEl.classList.add('shake');
    setTimeout(()=>{for(let j=0;j<N;j++)if(j!==i&&!tiles[j].classList.contains('open'))mines.has(j)?drawBomb(j,true):drawGem(j,true)},350);
    multEl.textContent='💥';subEl.innerHTML=`Boom! Lost <b>$${fmt(bet)}</b>. Go again?`;setHeat(1);
    updateUI();subEl.innerHTML=`Boom! Lost <b>$${fmt(bet)}</b>. Go again?`;
    if(bal<1)$('refill').classList.add('show');
    return;
  }
  found++;mult=calc(found,mines.size);drawGem(i);
  sfx.gem(found);burst(x,y,14+found*3,gemHue(i),1+found*.06);showMult();
  floatText(mult.toFixed(2)+'×',x,y-10,30+Math.min(found,12)*2);
  if(found===N-mines.size){cash(true)}else updateUI();
}

function cash(perfect){
  if(!active||found===0)return;
  active=false;const win=Math.round(bet*mult*100)/100,profit=win-bet;
  setBal(bal+win);
  for(let j=0;j<N;j++)if(!tiles[j].classList.contains('open'))mines.has(j)?drawBomb(j,true):drawGem(j,true);
  sfx.win(mult);
  const [x,y]=center(boardEl);
  burst(x,y,60+Math.min(mult,30)*12,0,1.5,true);
  if(mult>=2||perfect)confettiRain(Math.min(220,60+mult*12));
  if(mult>=2)flash('#ffd54a77');
  if(perfect)banner('PERFECT!');else if(mult>=20)banner('MEGA WIN!');else if(mult>=8)banner('HUGE WIN!');else if(mult>=3)banner('BIG WIN!');else if(mult>=1.5)banner('NICE!');
  floatText('+$'+fmt(win),x,y,56);
  subEl.innerHTML=`Cashed out <b>+$${fmt(profit)}</b> profit`;
  updateUI();subEl.innerHTML=`Cashed out <b>+$${fmt(profit)}</b> profit`;
}

goBtn.onclick=()=>active?cash():start();
$('half').onclick=()=>betEl.value=Math.max(1,Math.floor(betEl.value/2));
$('dbl').onclick=()=>betEl.value=Math.max(1,Math.min(Math.floor(bal),Math.floor(betEl.value*2)));
minesEl.oninput=()=>$('minesLabel').textContent=minesEl.value;
$('refill').onclick=()=>{setBal(bal+1000);sfx.win();burst(innerWidth/2,innerHeight/2,80,45,1.3,true);$('refill').classList.remove('show')};
addEventListener('keydown',e=>{if(e.target===betEl||e.target===minesEl)return;if(e.code==='Space'){e.preventDefault();goBtn.click()}});
balEl.textContent=fmt(bal);updateUI();subEl.textContent='Place a bet and start digging';
})();
</script>
</body>
</html>
